<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<!-- 파비콘·홈 화면 아이콘 원본. ?size=48&round=1 처럼 열어서 그 크기로 캡처 -->
<style>
@font-face{font-family:LB;src:url(../fonts/LibreBaskerville-Italic.woff2);font-style:italic}
*{margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
.icon{width:512px;height:512px;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;
  transform-origin:0 0;font-family:LB,Georgia,serif;font-style:italic;font-size:380px;line-height:1}
.icon.round{border-radius:96px}
.icon span{transform:translate(-14px,6px)}
</style></head><body>
<div class="icon"><span>L</span></div>
<script>
const q=new URLSearchParams(location.search),s=+(q.get('size')||512),el=document.querySelector('.icon');
el.style.transform=`scale(${s/512})`; if(q.get('round'))el.classList.add('round');
</script>
</body></html>
